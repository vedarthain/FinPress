<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinPress Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 340px; background: #0B0F19; color: #F8FAFC; padding: 16px; border: 1px solid #1E293B; }
    .header { display: flex; items-center: center; justify-content: space-between; border-bottom: 1px solid #1E293B; padding-bottom: 10px; margin-bottom: 14px; }
    .logo { font-size: 15px; font-weight: 800; color: #F59E0B; letter-spacing: -0.5px; display: flex; align-items: center; gap: 6px; }
    .badge { font-size: 10px; font-family: monospace; background: #1E1B4B; color: #C4B5FD; border: 1px solid #4338CA; padding: 2px 6px; rounded: 4px; border-radius: 4px; }
    .desc { font-size: 12px; color: #94A3B8; line-height: 1.5; margin-bottom: 14px; }
    .btn { width: 100%; background: #D97706; hover: background: #B45309; color: #FFFFFF; border: none; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3); }
    .btn:hover { background: #B45309; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 12px; padding: 10px; border-radius: 6px; font-size: 11.5px; font-family: monospace; line-height: 1.4; display: none; }
    .status.success { display: block; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #6EE7B7; }
    .status.error { display: block; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #FCA5A5; }
    .status.info { display: block; background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.4); color: #A5B4FC; }
    .footer { margin-top: 14px; pt: 10px; border-top: 1px solid #1E293B; display: flex; justify-content: space-between; font-size: 11px; color: #64748B; }
    .footer a { color: #818CF8; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ FinPress Sync</div>
    <span class="badge">v1.0</span>
  </div>
  
  <p class="desc">Sync your <b>Business Standard</b> session directly to Cloudflare R2 and trigger today's news extraction in 1-click.</p>

  <button id="sync-btn" class="btn">
    <span>📌</span>
    <span>Sync BS Session Now</span>
  </button>

  <div id="status-box" class="status"></div>

  <div class="footer">
    <span>FinPress Dashboard</span>
    <a href="https://finpress.deb5045ai.workers.dev" target="_blank">Open App ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
