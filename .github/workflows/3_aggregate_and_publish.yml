name: 3. Aggregate and Publish

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST) - gives FE and BS plenty of time to finish
    - cron: '30 0 * * *'
  workflow_run:
    workflows: ["1. Fetch Financial Express", "2. Fetch Business Standard"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: aggregate-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate:
    name: ⚡ Deduplicate, Merge & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Unified Deduplication & Publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python main.py --source aggregate
          python sync_to_neon.py
