name: Daily Newspaper Automation (Gemini 3.8 Flash & Cloudflare R2 & Neon DB)

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-newspaper-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Restore Business Standard Session State (if provided)
        env:
          BS_STORAGE_STATE_BASE64: ${{ secrets.BS_STORAGE_STATE_BASE64 }}
        run: |
          if [ -n "$BS_STORAGE_STATE_BASE64" ]; then
            echo "$BS_STORAGE_STATE_BASE64" | base64 --decode > bs_storage_state.json
            echo "Restored Business Standard session state."
          else
            echo "No BS_STORAGE_STATE_BASE64 secret provided. Proceeding with Financial Express."
          fi

      - name: Execute Daily Financial Express News Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python main.py --source financial_express

      - name: Execute Daily Business Standard News Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          if [ -f bs_storage_state.json ]; then
            python main.py --source business_standard
          else
            echo "Skipping Business Standard (No session state)."
          fi

      - name: Run Unified Lossless Aggregation & Neon DB Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python aggregator.py
          python sync_to_neon.py
