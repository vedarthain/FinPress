name: FinPress Daily Automation

on:
  schedule:
    # Runs daily at 00:15 UTC (05:45 AM IST) - off-peak minute avoids GitHub scheduler queue delays
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  run-newspaper-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Restore Business Standard Session State (if provided)
        env:
          BS_STORAGE_STATE_BASE64: ${{ secrets.BS_STORAGE_STATE_BASE64 }}
        run: |
          python -c "
          import os, base64, re, json
          raw = os.environ.get('BS_STORAGE_STATE_BASE64', '').strip()
          if raw:
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              pad_len = len(clean) % 4
              if pad_len != 0:
                  clean += '=' * (4 - pad_len)
              try:
                  decoded = base64.b64decode(clean).decode('utf-8', errors='ignore')
                  json.loads(decoded)
                  with open('bs_storage_state.json', 'w', encoding='utf-8') as f:
                      f.write(decoded)
                  print('✅ Restored Business Standard session state successfully.')
              except Exception as e:
                  print(f'⚠️ Warning: Could not decode BS_STORAGE_STATE_BASE64: {e}')
          else:
              print('ℹ️ No BS_STORAGE_STATE_BASE64 secret provided. Proceeding with Financial Express.')
          "

      - name: Execute FinPress Unified News Intelligence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          BS_STORAGE_STATE_BASE64: ${{ secrets.BS_STORAGE_STATE_BASE64 }}
        run: |
          python main.py --source all
          python sync_to_neon.py
