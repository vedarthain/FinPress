name: 1. Fetch Financial Express

on:
  schedule:
    # Runs daily at 00:15 UTC (05:45 AM IST)
    - cron: '15 0 * * *'
  workflow_dispatch:

concurrency:
  group: fetch-fe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-fe:
    name: 📰 Download & Extract Financial Express
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Execute Financial Express Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          python main.py --source financial_express

      - name: Upload Financial Express Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-reports
          path: reports/news_report_fe_*.json
          if-no-files-found: warn
          retention-days: 1
