name: 2. Fetch Business Standard

on:
  schedule:
    # 00:22 UTC (05:52 AM IST) - Primary morning run (off-peak minute)
    - cron: '22 0 * * *'
    # 00:52 UTC (06:22 AM IST) - Backup run 1
    - cron: '52 0 * * *'
    # 01:22 UTC (06:52 AM IST) - Backup run 2
    - cron: '22 1 * * *'
    # 01:52 UTC (07:22 AM IST) - Backup run 3
    - cron: '52 1 * * *'
    # 02:52 UTC (08:22 AM IST) - Final morning sweep
    - cron: '52 2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-bs-pipeline, trigger-full-pipeline, sync-session]

concurrency:
  group: fetch-bs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-bs:
    name: 📰 Download & Extract Business Standard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Execute Business Standard Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          BS_STORAGE_STATE_BASE64: ${{ secrets.BS_STORAGE_STATE_BASE64 }}
          BS_EMAIL: ${{ secrets.BS_EMAIL }}
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_PASSWORD: ${{ secrets.BS_PASSWORD }}
        run: |
          echo "========================================================"
          echo " STEP 1: DOWNLOADING & ANALYZING BUSINESS STANDARD"
          echo "========================================================"
          python main.py --source business_standard

          echo "========================================================"
          echo " STEP 2: UNIFYING, DEDUPLICATING & PUBLISHING MASTER"
          echo "========================================================"
          python main.py --source aggregate
          python sync_to_neon.py || echo "DB Notice: Sync to Neon skipped if not configured."
          python scripts/r2_housekeeping.py --max-gb 3.0 --target-gb 2.2 || echo "Housekeeping Notice: Skipped if R2 not configured."

      - name: Upload Business Standard Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bs-reports
          path: reports/news_report_*.json
          if-no-files-found: warn
          retention-days: 1
