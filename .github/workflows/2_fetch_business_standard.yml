name: 2. Fetch Business Standard

on:
  schedule:
    # Runs daily at 00:15 UTC (05:45 AM IST)
    - cron: '15 0 * * *'
  workflow_dispatch:

jobs:
  fetch-bs:
    name: 📰 Download & Extract Business Standard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium --with-deps

      - name: Restore Business Standard Session State (if provided)
        env:
          BS_STORAGE_STATE_BASE64: ${{ secrets.BS_STORAGE_STATE_BASE64 }}
        run: |
          python -c "
          import os, base64, re, json
          raw = os.environ.get('BS_STORAGE_STATE_BASE64', '').strip()
          if raw:
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              pad_len = len(clean) % 4
              if pad_len != 0:
                  clean += '=' * (4 - pad_len)
              try:
                  decoded = base64.b64decode(clean).decode('utf-8', errors='ignore')
                  json.loads(decoded)
                  with open('bs_storage_state.json', 'w', encoding='utf-8') as f:
                      f.write(decoded)
                  print('✅ Restored Business Standard session state successfully.')
              except Exception as e:
                  print(f'⚠️ Warning: Could not decode BS_STORAGE_STATE_BASE64: {e}')
          else:
              print('ℹ️ No BS_STORAGE_STATE_BASE64 secret provided.')
          "

      - name: Execute Business Standard Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          BS_STORAGE_STATE_BASE64: ${{ secrets.BS_STORAGE_STATE_BASE64 }}
          BS_EMAIL: ${{ secrets.BS_EMAIL }}
          BS_USERNAME: ${{ secrets.BS_USERNAME }}
          BS_PASSWORD: ${{ secrets.BS_PASSWORD }}
        run: |
          python main.py --source business_standard

      - name: Upload Business Standard Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bs-reports
          path: reports/news_report_bs_*.json
          if-no-files-found: warn
          retention-days: 1
